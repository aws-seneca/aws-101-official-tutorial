<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YOUR-NAME's AWS server</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f5f6f8; color: #16203a; }
    main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
    .tag { display: inline-block; font-size: 13px; background: #e6eefc; color: #1f5fd1; padding: 4px 10px; border-radius: 999px; }
    h1 { font-size: 34px; line-height: 1.15; margin: 16px 0 8px; }
    p { line-height: 1.6; }
    form { display: grid; gap: 12px; margin-top: 28px; background: #fff; border: 1px solid #dce0e8; border-radius: 12px; padding: 20px; }
    label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
    input { font: inherit; padding: 10px 12px; border: 1px solid #c6ccd8; border-radius: 8px; }
    button { font: inherit; font-weight: 600; padding: 11px; border: 0; border-radius: 8px; background: #1f5fd1; color: #fff; cursor: pointer; }
    small { color: #566079; }
  </style>
</head>
<body>
  <main>
    <span class="tag">Running on Amazon EC2</span>
    <h1>Hello from YOUR-NAME's server</h1>
    <p>This page is served by nginx on a t3.micro instance in AWS Canada (Central). Anyone on the internet can open it right now.</p>

    <!-- The form doesn't submit anywhere yet. Wiring it to a backend and a database is a project for another day. -->
    <form action="#" onsubmit="event.preventDefault(); this.querySelector('small').textContent = 'Nothing saved yet: there is no backend. That part is up to you.';">
      <label for="name">Name <input id="name" name="name" autocomplete="name"></label>
      <label for="email">Email <input id="email" name="email" type="email" autocomplete="email"></label>
      <button type="submit">Create account</button>
      <small>AWS 101 Workshop · AWS Student Builder Group @ Seneca</small>
    </form>
  </main>
</body>
</html>
